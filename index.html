<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaBank | Simulador de Crédito</title>
    <link rel="stylesheet" href="simulador.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="logo.png" alt="NovaBank Logo" class="logo">
            <h1>NovaBank</h1>
            <p>Simulador de Crédito Empresarial</p>

            <!-- ✅ MENÚ AGREGADO -->
            <nav class="menu">
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Simulador</a></li>
                    <li><a href="#">Gastos</a></li> <!-- 👈 NUEVO -->
                </ul>
            </nav>
        </div>

        <div class="card">
            <h2>Datos financieros</h2>

            <label>Ingresos</label>
            <input type="text" id="txtIngresos" placeholder="Ej: 3000">
            <span id="errIngresos" class="error-msg"></span>

            <label>Arriendo</label>
            <input type="text" id="txtArriendo" placeholder="Ej: 500">
            <span id="errArriendo" class="error-msg"></span>

            <label>Alimentación</label>
            <input type="text" id="txtAlimentacion" placeholder="Ej: 300">
            <span id="errAlimentacion" class="error-msg"></span>

            <label>Varios</label>
            <input type="text" id="txtVarios" placeholder="Ej: 200">
            <span id="errVarios" class="error-msg"></span>

            <p>Total gastos: <span id="spnTotalGastos">USD 0.00</span></p>

            <div class="result-box">
                <p>Disponible: <span id="spnDisponible">USD 0.00</span></p>
                <p>Capacidad de pago: <span id="spnCapacidadPago">USD 0.00</span></p>
            </div>

            <h2>Solicitud de crédito</h2>

            <label>Monto</label>
            <input type="text" id="txtMonto">
            <span id="errMonto" class="error-msg"></span>

            <label>Plazo (años)</label>
            <input type="text" id="txtPlazo">
            <span id="errPlazo" class="error-msg"></span>

            <label>Tasa (%)</label>
            <input type="text" id="txtTasaInteres">
            <span id="errTasaInteres" class="error-msg"></span>

            <div class="result-box">
                <p>Interés: <span id="spnInteresPagar">USD 0.00</span></p>
                <p>Total: <span id="spnTotalPrestamo">USD 0.00</span></p>
                <p>Cuota mensual: <span id="spnCuotaMensual">USD 0.00</span></p>
                <p class="estado">Estado: <span id="spnEstadoCredito">ESPERANDO DATOS</span></p>
            </div>

            <div class="buttons">
                <button onclick="calcular()">Calcular Crédito</button>
                <button type="button" onclick="reiniciarSimulador()">Limpiar</button>
            </div>
        </div>
    </div>

    <script src="funciones.js"></script>
    <script src="simulador.js"></script>
</body>
</html>
